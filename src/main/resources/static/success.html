<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - FreshMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f4f6f8; }
        .success-container {
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        .success-container h2 {
            margin: 0;
            color: #333;
            font-size: 28px;
        }
        .success-details {
            margin: 30px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: #555;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-row span:last-child { font-weight: 600; color: #333; }
        .btn-home {
            display: inline-block;
            background: #2e7d32;
            color: #fff;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn-home:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="products.html" class="logo">🛒 FreshMart</a>
    </nav>

    <div class="success-container">
        <div class="success-icon">✓</div>
        <h2>Payment Successful!</h2>
        <p style="color: #666; margin-top: 10px;">Your order has been placed successfully.</p>
        
        <div class="success-details">
            <div class="detail-row">
                <span>Order ID</span>
                <span id="orderId">Loading...</span>
            </div>
            <div class="detail-row">
                <span>Date & Time</span>
                <span id="orderDate">Loading...</span>
            </div>
            <div class="detail-row">
                <span>Amount Paid</span>
                <span id="orderAmount">Loading...</span>
            </div>
        </div>

        <a href="products.html" class="btn-home">Continue Shopping</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dataStr = localStorage.getItem('paymentSuccessData');
            if (dataStr) {
                const data = JSON.parse(dataStr);
                document.getElementById('orderId').textContent = data.orderId;
                document.getElementById('orderDate').textContent = data.date;
                document.getElementById('orderAmount').textContent = data.amount;
                // Optional: clear cart locally since payment is done
                // localStorage.removeItem('paymentSuccessData');
            }
        });
    </script>
</body>
</html>
