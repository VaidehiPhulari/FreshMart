<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreshMart</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome to FreshMart</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username (e.g. testuser)">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password (e.g. password123)">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="auth-switch">
                <p>Don't have an account? <a href="#">Register</a></p>
                <p style="margin-top: 10px; color: #777; font-size: 0.8rem;">(Use 'testuser' / 'password123' to login)</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
